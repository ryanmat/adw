[project]
name = "ai-dev-workflow"
version = "0.1.0"
description = "The adw Claude Code plugin: slash-command sources, plan-grammar and auto-run scripts, hooks, and evals for a spec, plan, run workflow"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "evals/next-auto/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
tmp_path_retention_policy = "failed"
