# Description: gitleaks configuration: the default rules, plus an allowlist for the run keys and
# Description: ruling-store keys in fixtures and tests, which are UUID-shaped record identifiers.

[extend]
useDefault = true

[allowlist]
description = "run keys and ruling ids in fixtures and tests are record identifiers"
regexTarget = "line"
regexes = [
  '''runkey=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
  '''"runkey": "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''',
  '''key = 'rul-[0-9a-f]{10}\'''',
]
paths = [
  '''__pycache__/''',
  '''\.venv/''',
]
